<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Crossed wrenches behind -->
  <line x1="15" y1="105" x2="105" y2="15" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <line x1="15" y1="15" x2="105" y2="105" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <!-- Wrench open ends -->
  <circle cx="15" cy="105" r="8" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="105" cy="15" r="8" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="15" cy="15" r="8" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="105" cy="105" r="8" fill="none" stroke="#222" stroke-width="5"/>
  <!-- Skull shape -->
  <path d="M60 18 C32 18, 22 38, 22 55 C22 72, 32 82, 40 86 L40 94 L80 94 L80 86 C88 82, 98 72, 98 55 C98 38, 88 18, 60 18 Z" fill="#111"/>
  <!-- Skull top highlight -->
  <ellipse cx="60" cy="48" rx="30" ry="24" fill="#111"/>
  <!-- Left eye -->
  <ellipse cx="46" cy="52" rx="10" ry="12" fill="#fff"/>
  <!-- Right eye -->
  <ellipse cx="74" cy="52" rx="10" ry="12" fill="#fff"/>
  <!-- Nose hole -->
  <path d="M55 68 L60 76 L65 68 Z" fill="#fff"/>
  <!-- Jaw / Teeth area -->
  <rect x="40" y="84" width="40" height="10" rx="2" fill="#fff"/>
  <!-- Tooth gaps -->
  <line x1="48" y1="84" x2="48" y2="94" stroke="#111" stroke-width="2.5"/>
  <line x1="55" y1="84" x2="55" y2="94" stroke="#111" stroke-width="2.5"/>
  <line x1="60" y1="84" x2="60" y2="94" stroke="#111" stroke-width="2.5"/>
  <line x1="65" y1="84" x2="65" y2="94" stroke="#111" stroke-width="2.5"/>
  <line x1="72" y1="84" x2="72" y2="94" stroke="#111" stroke-width="2.5"/>
</svg>
