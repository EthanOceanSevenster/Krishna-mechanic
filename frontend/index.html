<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <!-- Google only reads ICO, PNG, GIF, JPEG and SVG favicons — an AVIF one is
         ignored and the search result falls back to a generic globe. -->
    <!-- Google wants a multiple of 48px square, so the 96x96 PNG is listed first
         and the .ico declares "any" rather than pinning a 32px hint. -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Title, description, canonical, Open Graph and JSON-LD are injected per route
         at build time by prerender.mjs, and kept in sync client-side by src/seo.js.
         Do not hard-code them here. -->
    <!--seo-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
